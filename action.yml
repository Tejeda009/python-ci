name: 'Pipery Python CI'
description: 'CI pipeline for Python: SAST, SCA, lint, build, test, versioning, packaging, release, reintegration'
inputs:
  project_path:
    description: 'Path to the project source tree.'
    required: false
    default: '.'
  config_file:
    description: 'Path to pipery config file.'
    required: false
    default: '.pipery/config.yaml'
  package_manager:
    description: 'Package manager: auto, setuptools, poetry, uv.'
    required: false
    default: 'auto'
  python_version:
    description: 'Python version to use.'
    required: false
    default: '3.11'
  skip_sast:
    description: 'Skip SAST scan.'
    required: false
    default: 'false'
  skip_sca:
    description: 'Skip SCA scan.'
    required: false
    default: 'false'
  skip_lint:
    description: 'Skip lint step.'
    required: false
    default: 'false'
  skip_build:
    description: 'Skip build step.'
    required: false
    default: 'false'
  tests_path:
    description: 'Path passed to pytest (directory, file, or nodeids). Defaults to project_path.'
    required: false
    default: ''
  skip_test:
    description: 'Skip test step.'
    required: false
    default: 'false'
  skip_versioning:
    description: 'Skip versioning step.'
    required: false
    default: 'false'
  skip_packaging:
    description: 'Skip packaging step.'
    required: false
    default: 'false'
  skip_release:
    description: 'Skip release step.'
    required: false
    default: 'false'
  skip_reintegration:
    description: 'Skip reintegration step.'
    required: false
    default: 'false'
  version_bump:
    description: 'Version bump kind: patch, minor, major.'
    required: false
    default: 'patch'
  registry:
    description: 'Registry target for release.'
    required: false
    default: 'pypi'
  pypi_token:
    description: 'PyPI API token for publishing.'
    required: false
    default: ''
  github_token:
    description: 'GitHub token for reintegration.'
    required: false
    default: ''
  target_branch:
    description: 'Target branch for reintegration.'
    required: false
    default: 'main'
  log_file:
    description: 'Path to the JSONL log file.'
    required: false
    default: 'pipery.jsonl'
runs:
  using: composite
  steps:
    - id: config
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.project_path }}
        INPUT_CONFIG_FILE: ${{ inputs.config_file }}
        INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
      run: |
        set -euo pipefail
        project_path="${INPUT_PROJECT_PATH}"
        config_file="${INPUT_CONFIG_FILE}"
        if [[ "${config_file}" = /* ]]; then
          config_path="${config_file}"
        else
          config_path="${project_path}/${config_file}"
        fi
        python3 -c 'import yaml' 2>/dev/null || pip install pyyaml -q
        python3 - "${config_path}" "${INPUT_PYTHON_VERSION}" "${GITHUB_OUTPUT}" <<'PY'
        import re
        import sys

        import yaml

        config_path, input_version, output_path = sys.argv[1:]
        version = input_version
        try:
            with open(config_path, encoding="utf-8") as config_file:
                config = yaml.safe_load(config_file) or {}
        except FileNotFoundError:
            config = {}

        config_version = config.get("python_version")
        if input_version == "3.11" and isinstance(config_version, (str, int, float)):
            version = str(config_version)
        if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}(?:[-+].*)?", version):
            raise SystemExit(f"Invalid python_version: {version}")
        with open(output_path, "a", encoding="utf-8") as output:
            output.write(f"python_version={version}\n")
        PY
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ steps.config.outputs.python_version }}
    - id: main
      shell: bash
      env:
        INPUT_PROJECT_PATH: ${{ inputs.project_path }}
        INPUT_CONFIG_FILE: ${{ inputs.config_file }}
        INPUT_PACKAGE_MANAGER: ${{ inputs.package_manager }}
        INPUT_PYTHON_VERSION: ${{ inputs.python_version }}
        INPUT_SKIP_SAST: ${{ inputs.skip_sast }}
        INPUT_SKIP_SCA: ${{ inputs.skip_sca }}
        INPUT_SKIP_LINT: ${{ inputs.skip_lint }}
        INPUT_SKIP_BUILD: ${{ inputs.skip_build }}
        INPUT_TESTS_PATH: ${{ inputs.tests_path }}
        INPUT_SKIP_TEST: ${{ inputs.skip_test }}
        INPUT_SKIP_VERSIONING: ${{ inputs.skip_versioning }}
        INPUT_SKIP_PACKAGING: ${{ inputs.skip_packaging }}
        INPUT_SKIP_RELEASE: ${{ inputs.skip_release }}
        INPUT_SKIP_REINTEGRATION: ${{ inputs.skip_reintegration }}
        INPUT_VERSION_BUMP: ${{ inputs.version_bump }}
        INPUT_REGISTRY: ${{ inputs.registry }}
        INPUT_PYPI_TOKEN: ${{ inputs.pypi_token }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github_token }}
        INPUT_TARGET_BRANCH: ${{ inputs.target_branch }}
        INPUT_LOG_FILE: ${{ inputs.log_file }}
      run: |
          set -euo pipefail
          "$GITHUB_ACTION_PATH/src/main.sh"
branding:
  icon: package
  color: blue
